{{- if .Values.monitoring.enabled }}
# Tells Prometheus to scrape the API's /metrics endpoint.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "job-pipeline.fullname" . }}-api
  labels:
    {{- include "job-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      {{- include "job-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      # The app redirects /metrics to /metrics/.
      path: /metrics/
      interval: 30s
{{- end }}
