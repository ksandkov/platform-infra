apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "job-pipeline.fullname" . }}
  labels:
    {{- include "job-pipeline.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "job-pipeline.fullname" . }}-api
                port:
                  name: http
