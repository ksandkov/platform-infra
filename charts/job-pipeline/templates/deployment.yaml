apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "job-pipeline.fullname" . }}-api
  labels:
    {{- include "job-pipeline.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "job-pipeline.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "job-pipeline.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
      annotations:
        # Restart pods when non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- include "job-pipeline.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "job-pipeline.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          {{- include "job-pipeline.env" . | nindent 10 }}
          # /healthz never touches the DB; /readyz does, so traffic only arrives once Postgres is reachable.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "job-pipeline.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
